    const ROOM_ID = "shrewloveshyrax";

    // Passphrase: iloveyou
    const EXPECTED_HASH_HEX =
      "e4ad93ca07acb8d908a3aa41e920ea4f4ef4f26e7f86cf8291c5db289780a5ae";

    /* ===============================
       FIREBASE IMPORTS (TOP LEVEL)
    =============================== */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
      getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,

    /* ===============================

    =============================== */
    const gate = document.getElementById("gate");
    const gateCard = document.getElementById("gateCard");
    const gateInput = document.getElementById("gateInput");
    const gateBtn = document.getElementById("gateBtn");
    const statusChip = document.getElementById("statusChip");
    const addBtn = document.getElementById("addBtn");
    const board = document.getElementById("board");

    async function sha256Hex(str){
      const enc = new TextEncoder().encode(str);
      const buf = await crypto.subtle.digest("SHA-256", enc);
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
    }

    async function tryUnlock(){
      const phrase = gateInput.value.trim();
      if (!phrase) return;

      const hash = await sha256Hex(phrase);
      if (hash === EXPECTED_HASH_HEX) {
        localStorage.setItem(UNLOCK_KEY, "1");
        gate.style.display = "none";
        board.classList.add("live");
        statusChip.textContent = "connecting…";
        addBtn.disabled = false;
        addBtn.style.opacity = "1";
        startApp();
      } else {
        gateCard.classList.remove("shake");
        void gateCard.offsetWidth;
        gateCard.classList.add("shake");
        gateInput.value = "";
      }
    }

    gateBtn.onclick = tryUnlock;
    gateInput.onkeydown = e => e.key === "Enter" && tryUnlock();

    if (localStorage.getItem(UNLOCK_KEY) === "1") {
      gate.style.display = "none";
      board.classList.add("live");
      addBtn.disabled = false;
      startApp();
    }

    /* ===============================
       MAIN APP
    =============================== */
    function startApp(){
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      const storage = getStorage(app);

      signInAnonymously(auth);
      onAuthStateChanged(auth, user => {
        statusChip.textContent = user ? "live" : "offline";
      });

    }
